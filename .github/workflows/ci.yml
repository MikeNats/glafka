name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style and types are the same answer on every OS, so they run once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  # The suite runs on all three. Nothing caught the Windows-only problems
  # before, because nothing ever ran there: a `curl.exe` slipped past the
  # network layer, and `npm install` could not even finish.
  #
  # Windows gets a POSIX shell on purpose. glafka runs the commands you put
  # in .glafka.json — checksCmd, the agent commands, setupCmd — and those are
  # shell strings people write once and expect to keep working. Running them
  # through cmd.exe instead would silently change what they mean, so the
  # shell is a requirement we state rather than a difference we paper over.
  # Git Bash ships with Git for Windows and is already on the runner.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node dist/installKit/bin/glafka.js --version
      - run: npm test
